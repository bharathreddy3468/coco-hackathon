[project]
name = "insurance-claims-copilot-backend"
version = "0.1.0"
description = "Production-style FastAPI backend for Insurance Claims Decision Copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "snowflake-connector-python[pandas]>=3.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "PyPDF2>=3.0.0",
    "pillow>=10.0.0",
    "easyocr>=1.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

